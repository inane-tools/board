[package]
name = "board"
version = "1.0.0"
description = "A local-first boards and journals desktop app"
authors = ["Board"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11", features = ["protocol-asset", "image-png", "image-ico", "devtools"] }
tauri-plugin-store = "~2.4"
tauri-plugin-drag = "~2.1"
tauri-plugin-clipboard-manager = "~2.3"
tauri-plugin-single-instance = "~2.4"
tauri-plugin-opener = "~2.5"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = "0.12"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5"
# WebView2 COM interface used to trim memory while the window is not in use
# (see `webview_memory.rs`); version kept in step with Tauri's own webview2-com.
webview2-com = "0.38"
# Taskbar thumbnail toolbar (the media buttons in the window's taskbar preview),
# which Windows requires the app to add itself.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# GTK overlay caption buttons change the webview's ancestors. Resolve the GTK
# toplevel safely in Linux's mouse/touch resize handlers instead of panicking.
[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
